<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mostrar Cookies</title>
    <a href="https://tridel.github.io/app-callback">Ir al callback</a>

    <button id="btn">Volver al app</button>

      <button id="btnaddtrip">Volver a addtrip</button>

      <button id="btnnotification">Volver a notifications</button>


    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f4f4f4;
        }
        h1 {
            color: #333;
        }
        pre {
            background: #fff;
            border: 1px solid #ccc;
            padding: 15px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
    </style>
</head>
<body>
    <h1>Cookies del dominio</h1>
    <pre id="cookieDisplay">Cargando cookies...</pre>

    <script>
         function callbackURL(toParam) {
    const ua = navigator.userAgent;
    const isIOS = /iPhone|iPad|iPod/.test(ua);

    if (isIOS) {
      const m = ua.match(/OS (\d+)_(\d+)(?:_(\d+))? like Mac OS X/);
      if (m) {
        const major = parseInt(m[1], 10);
        const minor = parseInt(m[2], 10); // Corregido: m[2] para la versión minor
        const iOSSupportsHttpsCallback = (major > 17) || (major === 17 && minor >= 4);
        
        if (!iOSSupportsHttpsCallback) {
          // Si el parámetro existe, lo agregamos a la URL del esquema personalizado
          if (toParam) {
            return `copa-oauth-test://app-callback?to=${encodeURIComponent(toParam)}`;
          }
          return 'copa-oauth-test://app-callback';
        }
      }
    }

    // Retorno por defecto (puedes adaptarlo si usas HTTPS callbacks)
    if (toParam) {
      return `https://tu-dominio.com{encodeURIComponent(toParam)}`;
    }
    return 'https://tu-dominio.com';
}

    // Android (Auth Tab https + assetlinks) e iOS 17.4+ (ASWebAuth https callback)
    return 'https://tridel.github.io/app-callback';
  }

    document.getElementById('btn').addEventListener('click', function () {
      window.location.href = callbackURL();
    });

   document.getElementById('btnaddtrip').addEventListener('click', function () {
      window.location.href = callbackURL("add_trip");
    });

    document.getElementById('btnnotification').addEventListener('click', function () {
      window.location.href = callbackURL("notifications");
    });
 
        function mostrarCookies() {
            const cookies = document.cookie;
            const display = document.getElementById("cookieDisplay");

            if (cookies) {
                display.textContent = cookies.split('; ')
                    .map(c => `• ${c}`)
                    .join('\n');
            } else {
                display.textContent = "No hay cookies almacenadas.";
            }
        }

        mostrarCookies();
    </script>
</body>
</html>
